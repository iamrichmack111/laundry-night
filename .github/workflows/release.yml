name: Tagged Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/laundry-night-${GITHUB_REF_NAME}.zip" \
            index.html style.css game.js start.sh README.md \
            package.json playwright.config.js server.js tests screenshots .github \
            -x '*.DS_Store'

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "Laundry Night $GITHUB_REF_NAME"

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laundry-night-release
          path: dist/*.zip
          if-no-files-found: warn
